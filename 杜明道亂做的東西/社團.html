      <h2>社團宗旨</h2>
      <p>
        近年來桌上遊戲越發盛行，有鑑於此，集合對桌上遊戲有共同興趣者，成立桌遊同好的平台，並從中培養正確的
        桌遊知識，增進邏輯思考、反應能力。
      </p>
      <p>
        藉由社團活動及桌遊週，推廣桌上遊戲這項活動，建立正確的桌遊知識與觀念，帶動正向的桌遊風氣，也讓喜愛
        桌遊的人有一個能夠互相交流的平台。
      </p>
      <p>
        此外，對桌遊設計有興趣的人可以有一個一起討論的空間，並與幹部社員一同試玩、修改，獲得較完善的幫助，更
        可從設計桌遊的過程中增進交流，獲得前所未有的成就感。
      </p>
    </section>
